<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Para você ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #ffe4ec, #fce7f3, #e6f3ff);
      color: #333;
    }

    .heart {
      position: fixed;
      bottom: -30px;
      width: 18px;
      height: 18px;
      background: #ff6b81;
      transform: rotate(45deg);
      animation: subir 8s linear infinite;
      opacity: 0.5;
      z-index: 0;
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      background: #ff6b81;
      border-radius: 50%;
    }

    .heart::before {
      top: -9px;
      left: 0;
    }

    .heart::after {
      left: -9px;
      top: 0;
    }

    @keyframes subir {
      0% {
        transform: translateY(0) rotate(45deg) scale(0.7);
        opacity: 0;
      }

      20% {
        opacity: 0.6;
      }

      100% {
        transform: translateY(-120vh) rotate(45deg) scale(1.2);
        opacity: 0;
      }
    }

    .container {
      position: relative;
      z-index: 10;
      width: min(700px, 90%);
      padding: 40px 30px;
      text-align: center;
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(15px);
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
      animation: aparecer 1s ease;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(25px) scale(0.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    h1 {
      margin-top: 0;
      margin-bottom: 25px;
      font-size: clamp(28px, 6vw, 44px);
      color: #d6335c;
    }

    #texto {
      min-height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(18px, 4vw, 23px);
      line-height: 1.7;
      color: #333;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    button {
      margin-top: 25px;
      border: none;
      border-radius: 999px;
      padding: 15px 32px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      background: linear-gradient(135deg, #ff5277, #e63963);
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(230, 57, 99, 0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 30px rgba(230, 57, 99, 0.4);
    }

    button:active {
      transform: scale(0.95);
    }

    #final {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 30px;
      text-align: center;
      background: linear-gradient(135deg, #ffe4ec, #fff0f5);
      animation: aparecer 1s ease;
    }

    #final h2 {
      font-size: clamp(40px, 10vw, 70px);
      color: #d6335c;
      margin: 0 0 20px;
    }

    #final p {
      font-size: clamp(20px, 5vw, 28px);
      line-height: 1.6;
      max-width: 650px;
    }

    .coracao-final {
      position: fixed;
      font-size: 30px;
      pointer-events: none;
      animation: explodir 2.5s ease-out forwards;
    }

    @keyframes explodir {
      0% {
        transform: translate(0, 0) scale(0.5);
        opacity: 1;
      }

      100% {
        transform: translate(var(--x), var(--y)) scale(1.5) rotate(360deg);
        opacity: 0;
      }
    }

    @media (max-width: 600px) {
      .container {
        padding: 30px 20px;
      }

      #texto {
        min-height: 240px;
        font-size: 18px;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <audio id="musica" preload="auto" loop>
    <source src="experience.mp3" type="audio/mpeg">
  </audio>


  <script>
    for (let i = 0; i < 25; i++) {

      const heart = document.createElement("div");

      heart.className = "heart";

      heart.style.left =
        Math.random() * 100 + "vw";

      heart.style.animationDuration =
        (6 + Math.random() * 7) + "s";

      heart.style.animationDelay =
        Math.random() * 8 + "s";

      document.body.appendChild(heart);
    }
  </script>


  <main class="container" id="carta">

    <h1 id="titulo">
      Para a minha garota trabalhadora ❤️
    </h1>

    <div id="texto">

      <p>
        Eu sei que a vida anda corrida pra você...
        <br><br>
        Preparei isso para você.
        <br><br>
        Leia até o final. ❤️
      </p>

    </div>

    <button id="botao">
      Continuar ❤️
    </button>

  </main>


  <section id="final">

    <h2>
      Lhe amo ❤️
    </h2>

    <p>
      &lt;3
    </p>

  </section>


  <script>

    const titulo =
      document.getElementById("titulo");

    const texto =
      document.getElementById("texto");

    const botao =
      document.getElementById("botao");

    const carta =
      document.getElementById("carta");

    const final =
      document.getElementById("final");

    const musica =
      document.getElementById("musica");


    const mensagens = [

      {
        titulo: "Para a minha garota trabalhadora ❤️",

        texto: `
          <p>
            Eu sei que a vida anda corrida pra você,
            sei das suas dores, seus esforços,
            tudo o que você me permitiu conhecer
            até então...
          </p>
        `
      },

      {
        titulo: "Quero que você saiba... ❤️",

        texto: `
          <p>
            quero que saiba que eu lhe admiro
            grandemente, e que vc é um ser incrível,
            que algum dia, se não nessa vida ou em outra,
            quero poder ter o privilégio de conhecer
            pessoalmente....
          </p>
        `
      },

      {
        titulo: "Um sonho meu... ❤️",

        texto: `
          <p>
            meu sonho seria poder te olhar bem de perto,
            e dizer o quanto vc é especial...
          </p>
        `
      },

      {
        titulo: "Se esse dia nunca chegar...",

        texto: `
          <p>
            Caso esse dia nunca chegue, quero que saiba
            que enquanto escrevo isso pra você,
            é a coisa mais verdadeira que já disse
            até hoje, é do fundo do meu coração...
          </p>
        `
      },

      {
        titulo: "Só quero te pedir uma coisa... ❤️",

        texto: `
          <p>
            te peço que nao desista,
            que continue firme,
            pois a vida tem dessas né,
            nunca sabemos o dia de amanhã...
          </p>
        `
      },

      {
        titulo: "E nunca se esqueça...",

        texto: `
          <p>
            estarei sempre aqui pra você,
            independente de tudo!
          </p>
        `
      }

    ];


    let etapa = -1;

    let musicaIniciada = false;


    /* =====================================================
       PRIMEIRO CLIQUE
       ===================================================== */

    botao.addEventListener("click", () => {

      if (!musicaIniciada) {

        musicaIniciada = true;

        /*
          Primeiro iniciamos a música.
          Isso é mais compatível com celulares,
          pois o play() acontece diretamente
          dentro do toque/clique do usuário.
        */

        musica.play()
          .then(() => {

            /*
              Depois que a música começou,
              colocamos exatamente em 01:51.

              01:51 = 111 segundos.
            */

            musica.currentTime = 111;

          })
          .catch((erro) => {

            console.log(
              "Não foi possível reproduzir a música:",
              erro
            );

            musicaIniciada = false;

          });

      }


      /*
        A partir daqui, cada clique muda
        somente a mensagem.

        A música continua normalmente.
      */

      mostrarProximaMensagem();

    });


    function mostrarProximaMensagem() {

      etapa++;


      if (etapa >= mensagens.length) {

        mostrarFinal();

        return;

      }


      texto.style.opacity = "0";

      texto.style.transform =
        "translateY(-10px)";


      setTimeout(() => {

        titulo.textContent =
          mensagens[etapa].titulo;

        texto.innerHTML =
          mensagens[etapa].texto;

        texto.style.opacity = "1";

        texto.style.transform =
          "translateY(0)";


        if (etapa === mensagens.length - 1) {

          botao.textContent =
            "Tem mais uma coisa... ❤️";

        } else {

          botao.textContent =
            "Continuar ❤️";

        }

      }, 400);

    }


    function mostrarFinal() {

      carta.style.display = "none";

      final.style.display = "flex";

      criarCoracoes();

      setTimeout(() => {

        criarCoracoes();

      }, 700);

    }


    function criarCoracoes() {

      const simbolos = [
        "❤️",
        "💕",
        "💗",
        "💖",
        "💘"
      ];


      for (let i = 0; i < 25; i++) {

        const coracao =
          document.createElement("div");

        coracao.className =
          "coracao-final";

        coracao.textContent =
          simbolos[
            Math.floor(
              Math.random() *
              simbolos.length
            )
          ];


        const x =
          (Math.random() - 0.5) * 700;

        const y =
          (Math.random() - 0.5) * 700;


        coracao.style.left = "50%";

        coracao.style.top = "50%";


        coracao.style.setProperty(
          "--x",
          x + "px"
        );

        coracao.style.setProperty(
          "--y",
          y + "px"
        );


        document.body.appendChild(
          coracao
        );


        setTimeout(() => {

          coracao.remove();

        }, 2500);

      }

    }

  </script>

</body>

</html>
